<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTH Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        gray: tailwind.colors.zinc
                    }
                }
            }
        }
    </script>
    <script defer crossorigin="anonymous" src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.js"></script>

    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body
    class="bg-gray-100 dark:bg-gray-900 min-h-screen text-gray-800 dark:text-gray-200 dark:text-gray-200 transition-colors duration-200">
    <div x-data="app()" x-init="init()" class="container mx-auto px-4 py-8">
        <!-- 头部 -->
        <header class="mb-8">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-200" x-text="t('app.title')"></h1>
                    <p class="text-gray-600 dark:text-gray-400" x-text="t('app.subtitle')"></p>
                    <!-- 洞窟最近执行状态常驻标识 -->
                    <div x-show="caveOverallStatus !== null" class="mt-2 flex items-center gap-1.5"
                        @click="switchTab('cave')"
                        title="前往洞窟日志"
                        style="cursor:pointer; width:fit-content;">
                        <!-- error -->
                        <template x-if="caveOverallStatus && caveOverallStatus.status === 'error'">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300 ring-1 ring-red-300 dark:ring-red-700 select-none">
                                <span class="relative flex h-2 w-2">
                                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                                </span>
                                <span x-text="t('cave.statusLabel')"></span>
                                <span>·</span>
                                <span x-text="t('cave.error')"></span>
                                <span class="opacity-60" x-text="caveOverallStatus.date ? caveOverallStatus.date.substring(5) : ''"></span>
                            </span>
                        </template>
                        <!-- finished -->
                        <template x-if="caveOverallStatus && caveOverallStatus.status === 'finished'">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-300 ring-1 ring-green-300 dark:ring-green-700 select-none">
                                <span class="inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                                <span x-text="t('cave.statusLabel')"></span>
                                <span>·</span>
                                <span x-text="t('cave.finished')"></span>
                                <span class="opacity-60" x-text="caveOverallStatus.date ? caveOverallStatus.date.substring(5) : ''"></span>
                            </span>
                        </template>
                        <!-- started / unfinished -->
                        <template x-if="caveOverallStatus && caveOverallStatus.status === 'started'">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-700 dark:bg-yellow-900/40 dark:text-yellow-300 ring-1 ring-yellow-300 dark:ring-yellow-700 select-none">
                                <span class="inline-flex rounded-full h-2 w-2 bg-yellow-500"></span>
                                <span x-text="t('cave.statusLabel')"></span>
                                <span>·</span>
                                <span x-text="t('cave.unfinished')"></span>
                                <span class="opacity-60" x-text="caveOverallStatus.date ? caveOverallStatus.date.substring(5) : ''"></span>
                            </span>
                        </template>
                    </div>
                </div>
                <!-- 右侧操作区：深色模式 & 语言选择器 -->
                <div class="flex items-center gap-2">
                    <button @click="toggleDarkMode()"
                        class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-gray-600 dark:text-gray-400 dark:text-gray-300"
                        :title="isDarkMode ? t('app.lightMode') : t('app.darkMode')">
                        <svg x-show="!isDarkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                            </path>
                        </svg>
                        <svg x-show="isDarkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                            </path>
                        </svg>
                    </button>
                    <select x-model="currentLang" @change="setLanguage($event.target.value)"
                        class="bg-white dark:bg-gray-800 border dark:border-gray-600 border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 px-3 py-1.5 rounded text-sm cursor-pointer hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="zh-CN">简体中文</option>
                        <option value="zh-TW">繁體中文</option>
                        <option value="en-US">English</option>
                        <option value="ja-JP">日本語</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- 操作按钮 -->
        <div class="mb-6">
            <div class="flex flex-wrap gap-4">
                <button @click="refreshAll()" :disabled="loading"
                    class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 disabled:opacity-50 transition"
                    x-text="loading ? t('status.loading') : t('btn.refresh')">
                </button>
                <button @click="triggerScrape()" :disabled="scraping"
                    class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 disabled:opacity-50 transition"
                    x-text="scraping ? t('status.scraping') : t('btn.scrape')">
                </button>
                <button @click="triggerETL()" :disabled="etlProcessing"
                    class="px-4 py-2 bg-orange-500 text-white rounded hover:bg-orange-600 disabled:opacity-50 transition"
                    x-text="etlProcessing ? t('status.processing') : t('btn.etl')">
                </button>
            </div>
            <div class="mt-4 bg-white dark:bg-gray-800 rounded-lg shadow p-4">
                <div class="flex flex-wrap items-end gap-3">
                    <div class="min-w-0 flex-1 basis-64">
                        <label class="block text-gray-700 dark:text-gray-300 mb-1 text-sm"
                            x-text="t('schedule.scrape')"></label>
                        <input x-model="schedule.cronScrape" type="text"
                            class="bg-white dark:bg-gray-800 dark:text-gray-200 border dark:border-gray-600 rounded px-3 py-2 w-full font-mono text-sm"
                            :placeholder="t('schedule.placeholder')">
                    </div>
                    <div class="min-w-0 flex-1 basis-64">
                        <label class="block text-gray-700 dark:text-gray-300 mb-1 text-sm"
                            x-text="t('schedule.etl')"></label>
                        <input x-model="schedule.cronETL" type="text"
                            class="bg-white dark:bg-gray-800 dark:text-gray-200 border dark:border-gray-600 rounded px-3 py-2 w-full font-mono text-sm"
                            :placeholder="t('schedule.placeholder')">
                    </div>
                    <button @click="saveSchedule()" :disabled="scheduleSaving"
                        class="px-4 py-2 bg-slate-700 text-white rounded hover:bg-slate-800 disabled:opacity-50 transition"
                        x-text="scheduleSaving ? t('status.processing') : t('schedule.save')">
                    </button>
                </div>
                <div class="mt-2 text-xs text-gray-500 dark:text-gray-500">
                    <span x-text="t('schedule.hint')"></span>
                    <span x-show="schedule.configPath"> · <span x-text="schedule.configPath"></span></span>
                </div>
                <div x-show="scheduleStatus" class="mt-2 text-sm text-green-600" x-text="scheduleStatus"></div>
                <div x-show="scheduleError" class="mt-2 text-sm text-red-600" x-text="scheduleError"></div>
            </div>
            <p class="mt-2 text-sm text-gray-500 dark:text-gray-500">
                <span class="text-amber-600">⚠️</span> <span x-text="t('warn.scrape')"></span>
            </p>
        </div>

        <!-- Tab 切换 -->
        <div class="mb-6 border-b dark:border-gray-700 border-gray-200 dark:border-gray-700">
            <nav class="flex space-x-8">
                <button @click="switchTab('mmth')"
                    :class="activeTab === 'mmth' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 dark:text-gray-500 hover:text-gray-700 dark:text-gray-300'"
                    class="py-4 px-1 border-b-2 font-medium text-sm" x-text="t('tab.mmth')">
                </button>
                <button @click="switchTab('logs')"
                    :class="activeTab === 'logs' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 dark:text-gray-500 hover:text-gray-700 dark:text-gray-300'"
                    class="py-4 px-1 border-b-2 font-medium text-sm" x-text="t('tab.logs')">
                </button>
                <button @click="switchTab('cave')"
                    :class="activeTab === 'cave' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 dark:text-gray-500 hover:text-gray-700 dark:text-gray-300'"
                    class="py-4 px-1 border-b-2 font-medium text-sm" x-text="t('tab.cave')">
                </button>
                <button @click="switchTab('challenge')"
                    :class="activeTab === 'challenge' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 dark:text-gray-500 hover:text-gray-700 dark:text-gray-300'"
                    class="py-4 px-1 border-b-2 font-medium text-sm" x-text="t('tab.challenge')">
                </button>
                <button @click="switchTab('items')"
                    :class="activeTab === 'items' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 dark:text-gray-500 hover:text-gray-700 dark:text-gray-300'"
                    class="py-4 px-1 border-b-2 font-medium text-sm" x-text="t('tab.items')">
                </button>
            </nav>
        </div>

        <!-- MMTH 钻石监控 Tab -->
        <div x-show="activeTab === 'mmth'" x-cloak>
            <p class="text-sm text-gray-500 dark:text-gray-500 mb-4" x-show="lastScrapeTime"
                x-text="t('mmth.lastScrapeTime', {time: lastScrapeTime})"></p>

            <!-- 最新抓取数据 -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4" x-text="t('mmth.latestData')"></h2>
                <div x-show="latestData.length === 0" class="text-gray-500 dark:text-gray-500"
                    x-text="t('status.noData')"></div>
                <div x-show="latestData.length > 0" class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
                                <th class="text-left py-3 px-4" x-text="t('col.server')"></th>
                                <th class="text-left py-3 px-4" x-text="t('col.account')"></th>
                                <th class="text-right py-3 px-4" x-text="t('col.totalDiamond')"></th>
                                <th class="text-right py-3 px-4" x-text="t('col.freeDiamond')"></th>
                                <th class="text-right py-3 px-4" x-text="t('col.paidDiamond')"></th>
                                <th class="text-left py-3 px-4" x-text="t('col.status')"></th>
                                <th class="text-left py-3 px-4" x-text="t('col.time')"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="item in latestData" :key="item.account">
                                <tr class="border-b dark:border-gray-700 hover:bg-gray-50 dark:bg-gray-800">
                                    <td class="py-3 px-4" x-text="item.server"></td>
                                    <td class="py-3 px-4 font-medium" x-text="item.account"></td>
                                    <td class="py-3 px-4 text-right font-mono" x-text="item.total.toLocaleString()">
                                    </td>
                                    <td class="py-3 px-4 text-right font-mono text-blue-600"
                                        x-text="item.free.toLocaleString()"></td>
                                    <td class="py-3 px-4 text-right font-mono text-purple-600"
                                        x-text="item.paid.toLocaleString()"></td>
                                    <td class="py-3 px-4">
                                        <span x-show="!item.error" class="text-green-600"
                                            x-text="t('status.normal')"></span>
                                        <span x-show="item.error" class="text-red-600" x-text="item.error"></span>
                                    </td>
                                    <td class="py-3 px-4 text-sm text-gray-500 dark:text-gray-500"
                                        x-text="item.timestamp"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 历史趋势图 -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4" x-text="t('mmth.historyTrend')"></h2>
                <div class="mb-4 flex flex-wrap gap-4 items-end">
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 mb-1 text-sm"
                            x-text="t('mmth.selectAccount')"></label>
                        <select x-model="selectedAccount"
                            class="bg-white dark:bg-gray-800 dark:text-gray-200 border dark:border-gray-600 rounded px-3 py-2 w-48"
                            @change="updateMmthCharts()">
                            <option value="" x-text="t('mmth.allAccounts')"></option>
                            <template x-for="name in mmthAccountNames" :key="name">
                                <option :value="name" x-text="name"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 mb-1 text-sm"
                            x-text="t('mmth.dataType')"></label>
                        <select x-model="dataType"
                            class="bg-white dark:bg-gray-800 dark:text-gray-200 border dark:border-gray-600 rounded px-3 py-2 w-32"
                            @change="updateMmthCharts()">
                            <option value="total" x-text="t('mmth.total')"></option>
                            <option value="free" x-text="t('mmth.free')"></option>
                            <option value="paid" x-text="t('mmth.paid')"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 mb-1 text-sm"
                            x-text="t('mmth.timeGroup')"></label>
                        <select x-model="mmthTimeGroup"
                            class="bg-white dark:bg-gray-800 dark:text-gray-200 border dark:border-gray-600 rounded px-3 py-2 w-32"
                            @change="updateMmthCharts()">
                            <option value="raw" x-text="t('mmth.raw')"></option>
                            <option value="day" x-text="t('mmth.day')"></option>
                            <option value="week" x-text="t('mmth.week')"></option>
                            <option value="month" x-text="t('mmth.month')"></option>
                        </select>
                    </div>
                </div>
                <div id="historyChart" style="width: 100%; height: 400px;"></div>
            </div>

            <!-- 汇总统计卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <template x-for="item in latestData.filter(i => !i.error)" :key="item.account">
                    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-4">
                        <div class="text-sm text-gray-600 dark:text-gray-400" x-text="item.account"></div>
                        <div class="text-2xl font-bold text-blue-600" x-text="item.total.toLocaleString()"></div>
                        <div class="text-xs text-gray-400 mt-1">
                            <span x-text="t('logs.free')"></span>: <span x-text="item.free.toLocaleString()"></span> |
                            <span x-text="t('logs.paid')"></span>: <span x-text="item.paid.toLocaleString()"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- 钻石日志统计 Tab -->
        <div x-show="activeTab === 'logs'" x-cloak>
            <!-- 视图切换 -->
            <div class="mb-4 flex justify-start">
                <div class="inline-flex rounded-md shadow-sm" role="group">
                    <button type="button" @click="logsViewMode = 'trend'"
                        :class="logsViewMode === 'trend' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 dark:bg-gray-800 dark:text-gray-300 border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700'"
                        class="px-4 py-2 text-sm font-medium border rounded-l-lg focus:z-10 focus:ring-2 focus:ring-blue-500 transition-colors">
                        <span x-text="t('view.trend')"></span>
                    </button>
                    <button type="button" @click="logsViewMode = 'compare'"
                        :class="logsViewMode === 'compare' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 dark:bg-gray-800 dark:text-gray-300 border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700'"
                        class="px-4 py-2 text-sm font-medium border border-l-0 rounded-r-lg focus:z-10 focus:ring-2 focus:ring-blue-500 transition-colors">
                        <span x-text="t('view.compare')"></span>
                    </button>
                </div>
            </div>

            <!-- 通用筛选与趋势汇总 -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 mb-6">
                <div class="flex flex-wrap gap-4 items-end" :class="logsViewMode === 'trend' ? 'mb-4' : ''">
                        <div>
                            <label class="block text-gray-700 dark:text-gray-300 mb-2"
                                x-text="t('logs.selectCharacter')"></label>
                            <select x-model="selectedCharacter"
                                class="bg-white dark:bg-gray-800 dark:text-gray-200 border dark:border-gray-600 rounded px-3 py-2 w-full md:w-64"
                                @change="updateLogsCharts()">
                                <option value="" x-text="t('logs.all')"></option>
                                <template x-for="name in characterNames" :key="name">
                                    <option :value="name" x-text="name"></option>
                                </template>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 dark:text-gray-300 mb-2" x-text="t('logs.selectSource')"></label>
                            <select x-model="logsSelectedSource"
                                class="bg-white dark:bg-gray-800 dark:text-gray-200 border dark:border-gray-600 rounded px-3 py-2 w-48"
                                @change="updateLogsCharts()">
                                <option value="" x-text="t('logs.allSources')"></option>
                                <template x-for="opt in logsSourceOptions" :key="opt.value">
                                    <option :value="opt.value" x-text="opt.label"></option>
                                </template>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 dark:text-gray-300 mb-2" x-text="t('filter.dateRange')"></label>
                            <select x-model="logsDateRangeType"
                                class="bg-white dark:bg-gray-800 dark:text-gray-200 border dark:border-gray-600 rounded px-3 py-2 w-40"
                                @change="updateLogsCharts()">
                                <option value="all" x-text="t('range.all')"></option>
                                <option value="7d" x-text="t('range.7d')"></option>
                                <option value="30d" x-text="t('range.30d')"></option>
                                <option value="custom" x-text="t('range.custom')" disabled></option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 dark:text-gray-300 mb-2" x-text="t('mmth.timeGroup')"></label>
                            <select x-model="logsTimeGroup"
                                class="bg-white dark:bg-gray-800 dark:text-gray-200 border dark:border-gray-600 rounded px-3 py-2 w-32"
                                @change="updateLogsCharts()">
                                <option value="day" x-text="t('mmth.day')"></option>
                                <option value="week" x-text="t('mmth.week')"></option>
                                <option value="month" x-text="t('mmth.month')"></option>
                            </select>
                        </div>
                    </div>

                    <!-- 汇总卡片 -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4" x-show="logsViewMode === 'trend'" x-cloak>
                        <div class="bg-blue-50 dark:bg-blue-900/30 rounded p-4 flex flex-col justify-between">
                            <div class="text-sm text-blue-600" x-text="t('logs.totalGain')"></div>
                            <div class="text-2xl font-bold text-blue-800" x-text="currentGain.toLocaleString()"></div>
                        </div>
                        <div class="bg-red-50 dark:bg-red-900/30 rounded p-4 flex flex-col justify-between">
                            <div class="text-sm text-red-600" x-text="t('logs.totalConsume')"></div>
                            <div class="text-2xl font-bold text-red-800" x-text="currentConsume.toLocaleString()"></div>
                        </div>
                        <div class="bg-green-50 dark:bg-green-900/30 rounded p-4 flex flex-col justify-between">
                            <div class="text-sm text-green-600" x-text="t('logs.netChange')"></div>
                            <div class="text-2xl font-bold text-green-800" x-text="currentNetChange.toLocaleString()"></div>
                        </div>
                        <div class="bg-purple-50 dark:bg-purple-900/30 rounded p-4 flex flex-col justify-between relative overflow-hidden group">
                            <div class="absolute -right-4 -bottom-4 opacity-10 group-hover:opacity-20 transition-opacity">
                                <svg class="w-20 h-20 text-purple-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2zm0 2a8 8 0 100 16 8 8 0 000-16zm-3.5 4a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm7 0a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM12 11c1.657 0 3 1.343 3 3s-1.343 3-3 3-3-1.343-3-3 1.343-3 3-3zm0 2a1 1 0 100 2 1 1 0 000-2z"/></svg>
                            </div>
                            <div class="text-sm text-purple-600 relative z-10 flex items-center gap-1">
                                <span x-text="t('logs.avgNetChange')"></span>
                                <span x-show="fountainRangeLabel" class="text-xs px-1.5 py-0.5 bg-purple-100 dark:bg-purple-800 rounded-full" x-text="fountainRangeLabel"></span>
                            </div>
                            <div class="flex items-end gap-2 mt-1 relative z-10">
                                <div class="text-2xl font-bold text-purple-800" x-text="currentAvgNet !== null ? currentAvgNet.toLocaleString() : '-'"></div>
                                <div x-show="currentAvgNet !== null" class="text-sm text-purple-600 font-medium mb-1" x-text="t(fountainAvgLabel, {n: currentAvgNet})"></div>
                            </div>
                        </div>
                    </div>
                </div>

            <!-- 趋势视图图表 -->
            <div x-show="logsViewMode === 'trend'" x-cloak>
                <!-- 图表 -->
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 mb-6">
                    <div id="dailyChart" style="width: 100%; height: 400px;" class="mb-6"></div>
                    <div id="sourceChart" style="width: 100%; height: 300px;"></div>
                </div>
            </div>

            <!-- 全新对比视图 -->
            <div x-show="logsViewMode === 'compare'">
                <!-- 高亮卡片 -->

                        <div class="bg-purple-50 dark:bg-purple-900/30 border border-purple-200 dark:border-purple-800 p-4 rounded flex flex-col justify-between relative overflow-hidden group">
                            <div class="absolute -right-4 -bottom-4 opacity-10 group-hover:opacity-20 transition-opacity">
                                <svg class="w-20 h-20 text-purple-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2zm0 2a8 8 0 100 16 8 8 0 000-16zm-3.5 4a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm7 0a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM12 11c1.657 0 3 1.343 3 3s-1.343 3-3 3-3-1.343-3-3 1.343-3 3-3zm0 2a1 1 0 100 2 1 1 0 000-2z"/></svg>
                            </div>
                            <div class="text-sm text-purple-600 relative z-10 flex items-center gap-1">
                                <span x-text="t(itemAvgLabel)"></span>
                                <span x-show="itemRangeLabel" class="text-xs px-1.5 py-0.5 bg-purple-100 dark:bg-purple-800 rounded-full" x-text="itemRangeLabel"></span>
                            </div>
                            <div class="text-2xl font-bold text-purple-700 dark:text-purple-300 relative z-10" 
                                x-text="itemCurrentAvgNet !== null ? (itemCurrentAvgNet >= 0 ? '+' : '') + itemCurrentAvgNet.toLocaleString() : '-'"></div>
                        </div>
                    </div>
                </div>

            <!-- 趋势视图图表区 -->
            <div x-show="itemsViewMode === 'trend'" x-cloak>
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 mb-6">
                    <div id="itemDailyChart" style="width: 100%; height: 400px;" class="mb-6"></div>
                    <div id="itemSourceChart" style="width: 100%; height: 300px;"></div>
                </div>
            </div>

            <!-- 全新对比视图 -->
            <div x-show="itemsViewMode === 'compare'">
                <!-- 高亮卡片 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div class="bg-gradient-to-br from-green-50 to-green-100 dark:from-green-900/40 dark:to-green-800/40 border border-green-200 dark:border-green-700 p-4 rounded-lg shadow-sm">
                        <div class="text-sm font-bold text-green-700 dark:text-green-400 mb-2" x-text="t('compare.topGain')"></div>
                        <div class="text-lg font-bold text-gray-800 dark:text-gray-100 truncate" x-text="itemsTopGain.name || '-'"></div>
                        <div class="text-sm text-green-600 dark:text-green-300 mt-1" x-text="itemsTopGain.value ? '+' + itemsTopGain.value.toLocaleString() + ' / ' + t('mmth.day') : '-'"></div>
                    </div>
                    <div class="bg-gradient-to-br from-red-50 to-red-100 dark:from-red-900/40 dark:to-red-800/40 border border-red-200 dark:border-red-700 p-4 rounded-lg shadow-sm">
                        <div class="text-sm font-bold text-red-700 dark:text-red-400 mb-2" x-text="t('compare.topConsume')"></div>
                        <div class="text-lg font-bold text-gray-800 dark:text-gray-100 truncate" x-text="itemsTopConsume.name || '-'"></div>
                        <div class="text-sm text-red-600 dark:text-red-300 mt-1" x-text="itemsTopConsume.value ? '-' + itemsTopConsume.value.toLocaleString() : '-'"></div>
                    </div>
                    <div class="bg-gradient-to-br from-blue-50 to-blue-100 dark:from-blue-900/40 dark:to-blue-800/40 border border-blue-200 dark:border-blue-700 p-4 rounded-lg shadow-sm">
                        <div class="text-sm font-bold text-blue-700 dark:text-blue-400 mb-2" x-text="t('compare.topNet')"></div>
                        <div class="text-lg font-bold text-gray-800 dark:text-gray-100 truncate" x-text="itemsTopNet.name || '-'"></div>
                        <div class="text-sm text-blue-600 dark:text-blue-300 mt-1" x-text="itemsTopNet.value ? '+' + itemsTopNet.value.toLocaleString() : '-'"></div>
                    </div>
                </div>

                <!-- 横向对比条形图 -->
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 mb-4">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-4">
                            <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-200" x-text="t('compare.chartTitle')"></h3>
                            <!-- 在对比视图中保留物品类型的切换 -->
                            <select x-model="itemType" @change="updateItemCharts()"
                                class="bg-gray-50 dark:bg-gray-900 dark:text-gray-200 border border-gray-300 dark:border-gray-700 rounded px-2 py-1 text-sm">
                                <option value="runeTicket" x-text="t('items.runeTicket')"></option>
                                <option value="upgradePanacea" x-text="t('items.upgradePanacea')"></option>
                            </select>
                        </div>
                        <div class="inline-flex rounded-md shadow-sm">
                            <button type="button" @click="itemsCompareMetric = 'gain'"
                                :class="itemsCompareMetric === 'gain' ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-700 dark:bg-gray-800 dark:text-gray-300 border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700'"
                                class="px-3 py-1 text-xs font-medium border rounded-l focus:z-10 transition-colors" x-text="t('compare.metricGain')"></button>
                            <button type="button" @click="itemsCompareMetric = 'consume'"
                                :class="itemsCompareMetric === 'consume' ? 'bg-red-600 text-white border-red-600' : 'bg-white text-gray-700 dark:bg-gray-800 dark:text-gray-300 border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700'"
                                class="px-3 py-1 text-xs font-medium border border-l-0 focus:z-10 transition-colors" x-text="t('compare.metricConsume')"></button>
                            <button type="button" @click="itemsCompareMetric = 'netChange'"
                                :class="itemsCompareMetric === 'netChange' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 dark:bg-gray-800 dark:text-gray-300 border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700'"
                                class="px-3 py-1 text-xs font-medium border border-l-0 focus:z-10 transition-colors" x-text="t('compare.metricNetChange')"></button>
                            <button type="button" @click="itemsCompareMetric = 'avgGain'"
                                :class="itemsCompareMetric === 'avgGain' ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-gray-700 dark:bg-gray-800 dark:text-gray-300 border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700'"
                                class="px-3 py-1 text-xs font-medium border border-l-0 rounded-r focus:z-10 transition-colors" x-text="t('compare.metricAvgGain')"></button>
                        </div>
                    </div>
                    <div id="itemsCompareChart" style="height: 500px; width: 100%;"></div>
                </div>

                <!-- 数据表格 -->
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
                    <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                        <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-200" x-text="t('compare.tableTitle')"></h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700 text-sm">
                            <thead class="bg-gray-50 dark:bg-gray-900/50">
                                <tr>
                                    <th scope="col" class="px-4 py-3 text-left font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                                        @click="sortItemsCompareTable('name')">
                                        <div class="flex items-center gap-1">
                                            <span x-text="t('col.character')"></span>
                                            <span x-show="itemsCompareSortCol === 'name'" x-text="itemsCompareSortAsc ? '↑' : '↓'"></span>
                                        </div>
                                    </th>
                                    <th scope="col" class="px-4 py-3 text-right font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                                        @click="sortItemsCompareTable('gain')">
                                        <div class="flex items-center justify-end gap-1">
                                            <span x-text="t('logs.totalGain')"></span>
                                            <span x-show="itemsCompareSortCol === 'gain'" x-text="itemsCompareSortAsc ? '↑' : '↓'"></span>
                                        </div>
                                    </th>
                                    <th scope="col" class="px-4 py-3 text-right font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                                        @click="sortItemsCompareTable('consume')">
                                        <div class="flex items-center justify-end gap-1">
                                            <span x-text="t('logs.totalConsume')"></span>
                                            <span x-show="itemsCompareSortCol === 'consume'" x-text="itemsCompareSortAsc ? '↑' : '↓'"></span>
                                        </div>
                                    </th>
                                    <th scope="col" class="px-4 py-3 text-right font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                                        @click="sortItemsCompareTable('netChange')">
                                        <div class="flex items-center justify-end gap-1">
                                            <span x-text="t('logs.netChange')"></span>
                                            <span x-show="itemsCompareSortCol === 'netChange'" x-text="itemsCompareSortAsc ? '↑' : '↓'"></span>
                                        </div>
                                    </th>
                                    <th scope="col" class="px-4 py-3 text-right font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                                        @click="sortItemsCompareTable('avgGain')">
                                        <div class="flex items-center justify-end gap-1">
                                            <span x-text="t('compare.metricAvgGain')"></span>
                                            <span x-show="itemsCompareSortCol === 'avgGain'" x-text="itemsCompareSortAsc ? '↑' : '↓'"></span>
                                        </div>
                                    </th>
                                    <th scope="col" class="px-4 py-3 text-right font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                                        @click="sortItemsCompareTable('daysCount')">
                                        <div class="flex items-center justify-end gap-1">
                                            <span x-text="t('compare.days')"></span>
                                            <span x-show="itemsCompareSortCol === 'daysCount'" x-text="itemsCompareSortAsc ? '↑' : '↓'"></span>
                                        </div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200 dark:divide-gray-700 bg-white dark:bg-gray-800">
                                <template x-for="row in itemsCompareData" :key="row.name">
                                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition">
                                        <td class="px-4 py-3 whitespace-nowrap font-medium text-gray-900 dark:text-gray-100" x-text="row.name"></td>
                                        <td class="px-4 py-3 whitespace-nowrap text-right text-green-600 dark:text-green-400" x-text="'+' + row.gain.toLocaleString()"></td>
                                        <td class="px-4 py-3 whitespace-nowrap text-right text-red-600 dark:text-red-400" x-text="'-' + row.consume.toLocaleString()"></td>
                                        <td class="px-4 py-3 whitespace-nowrap text-right font-bold" 
                                            :class="row.netChange >= 0 ? 'text-blue-600 dark:text-blue-400' : 'text-red-600 dark:text-red-400'"
                                            x-text="(row.netChange >= 0 ? '+' : '') + row.netChange.toLocaleString()"></td>
                                        <td class="px-4 py-3 whitespace-nowrap text-right text-purple-600 dark:text-purple-400" x-text="'+' + row.avgGain.toLocaleString()"></td>
                                        <td class="px-4 py-3 whitespace-nowrap text-right text-gray-500 dark:text-gray-400" x-text="row.daysCount"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 模块加载顺序: i18n -> 工具 -> API -> 图表 -> Tab模块 -> 主入口 -->
    <script src="js/i18n/translations.js?v=34"></script>
    <script src="js/i18n/glossary.js?v=31"></script>
    <script src="js/i18n/i18n.js?v=31"></script>
    <script src="js/i18n/sources.js?v=39"></script>
    <script src="js/utils.js?v=36"></script>
    <script src="js/api.js?v=35"></script>
    <script crossorigin="anonymous" src="js/charts.js?v=61"></script>
    <script src="js/tabs/mmth.js?v=32"></script>
    <script src="js/tabs/logs.js?v=37"></script>
    <script src="js/tabs/cave.js?v=34"></script>
    <script src="js/tabs/challenge.js?v=31"></script>
    <script src="js/tabs/items.js?v=38"></script>
    <script src="js/app.js?v=46"></script>
</body>

</html>
